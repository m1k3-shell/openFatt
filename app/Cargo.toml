[package]
name = "openfatt"
description = "openFatt - fatturazione, magazzino e fatture elettroniche"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openfatt"
path = "src/main.rs"

[dependencies]
openfatt-core.workspace = true
openfatt-fatturapa.workspace = true
openfatt-pec.workspace = true
openfatt-store.workspace = true
openfatt-pdf.workspace = true
openfatt-interop.workspace = true
openfatt-sign.workspace = true
openfatt-pos.workspace = true
openfatt-bank.workspace = true
openfatt-backup.workspace = true
openfatt-update.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_extras = { version = "0.31", features = ["datepicker", "serde"] }
rfd = "0.15"
egui-phosphor = "0.9"
keyring = { version = "3", features = ["windows-native"] }
ureq = "2"
base64.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }


[features]
# Solo per le prove: chiave e indirizzi di prova al posto di quelli reali
prova-aggiornamento = []
# Solo per collaudi e schermate automatiche: schermata iniziale senza accesso (OPENFATT_SCREEN),
# clic simulati (OPENFATT_CLICKS) e versione finta (OPENFATT_VERSIONE). Mai nelle versioni distribuite.
strumenti-prova = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
rust_decimal_macros.workspace = true
png = "0.17"
